<!doctype html>
<html lang="en" data-theme="tabloid-spy">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Once a Liar: free party game for your phones, no app needed</title>
    <meta name="description" content="Everyone knows the codeword except the Spy. Scan a code, give one-word clues, argue, vote and unmask them. Free party game for 3–12 players on their own phones. No app, no account." />
    <meta name="theme-color" content="#FFE14D" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Once a Liar" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Once a Liar" />
    <meta property="og:title" content="Once a Liar: everyone knows the codeword except the Spy" />
    <meta property="og:description" content="A free party game for your phones. 3–12 players, no app, no account. Tap to play." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Once a Liar" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="/og-image.png" />

    <!-- fonts are imported by src/styles/tokens.css; warm up the connection early -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      /* paint the brand colour before JS/CSS arrive so a QR scan never flashes white */
      html, body { background: #ffe14d; color: #111; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Once a Liar needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
